<svg viewBox="0 0 760 1300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>

  <!-- initial node -->
  <circle cx="380" cy="26" r="13" fill="black"/>
  <line x1="380" y1="39" x2="380" y2="68" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- Box A -->
  <rect x="250" y="70" width="260" height="55" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="380" y="102" text-anchor="middle" font-size="13">Текст лекций (.tex)</text>
  <line x1="380" y1="125" x2="380" y2="158" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- Box B -->
  <rect x="230" y="160" width="300" height="72" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="380" y="188" text-anchor="middle" font-size="13">FIND definition &#8212; извлечение</text>
  <text x="380" y="207" text-anchor="middle" font-size="13">понятий по \odmkey</text>
  <line x1="380" y1="232" x2="380" y2="262" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- Decision D1 -->
  <polygon points="380,264 510,324 380,384 250,324" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="380" y="330" text-anchor="middle" font-size="13">Пара есть в эталоне?</text>

  <!-- D1 branches -->
  <line x1="250" y1="324" x2="150" y2="400" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <text x="175" y="365" text-anchor="middle" font-size="12" font-style="italic">да</text>

  <line x1="510" y1="324" x2="600" y2="400" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <text x="580" y="365" text-anchor="middle" font-size="12" font-style="italic">нет</text>

  <!-- Box C1 (left) -->
  <rect x="20" y="402" width="260" height="98" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="150" y="430" text-anchor="middle" font-size="13">Поиск совместного</text>
  <text x="150" y="449" text-anchor="middle" font-size="13">упоминания в окне</text>
  <text x="150" y="468" text-anchor="middle" font-size="13">смысловых блоков</text>
  <text x="150" y="487" text-anchor="middle" font-size="13">(CONTEXT)</text>

  <!-- Box C2 (right) -->
  <rect x="470" y="402" width="260" height="80" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="600" y="435" text-anchor="middle" font-size="13">Кандидат по совместному</text>
  <text x="600" y="454" text-anchor="middle" font-size="13">расположению \odmkey</text>

  <!-- merge M1 -->
  <polygon points="380,566 405,586 380,606 355,586" fill="white" stroke="black" stroke-width="1.4"/>
  <line x1="150" y1="500" x2="362" y2="580" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <line x1="600" y1="482" x2="398" y2="580" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <line x1="380" y1="606" x2="380" y2="636" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- Box E -->
  <rect x="230" y="638" width="300" height="72" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="380" y="666" text-anchor="middle" font-size="13">Классификация типа связи</text>
  <text x="380" y="685" text-anchor="middle" font-size="13">текстовыми шаблонами</text>
  <line x1="380" y1="710" x2="380" y2="740" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- Decision D2 -->
  <polygon points="380,742 510,802 380,862 250,802" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="380" y="808" text-anchor="middle" font-size="13">Расходится с эталоном?</text>

  <!-- D2 branches -->
  <line x1="250" y1="802" x2="150" y2="878" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <text x="175" y="843" text-anchor="middle" font-size="12" font-style="italic">да</text>

  <line x1="510" y1="802" x2="600" y2="878" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <text x="572" y="843" text-anchor="middle" font-size="12" font-style="italic">нет / новая пара</text>

  <!-- Box F1 (left) -->
  <rect x="20" y="880" width="260" height="72" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="150" y="908" text-anchor="middle" font-size="13">Источником истины</text>
  <text x="150" y="927" text-anchor="middle" font-size="13">считается эталон</text>

  <!-- Box F2 (right) -->
  <rect x="470" y="880" width="260" height="72" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="600" y="908" text-anchor="middle" font-size="13">Оставить как есть или</text>
  <text x="600" y="927" text-anchor="middle" font-size="13">исправить вручную</text>

  <!-- merge M2 -->
  <polygon points="380,1004 405,1024 380,1044 355,1024" fill="white" stroke="black" stroke-width="1.4"/>
  <line x1="150" y1="952" x2="362" y2="1018" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <line x1="600" y1="952" x2="398" y2="1018" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>
  <line x1="380" y1="1044" x2="380" y2="1074" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- Box G -->
  <rect x="240" y="1076" width="280" height="55" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="380" y="1108" text-anchor="middle" font-size="13">Генерация TDL по разделам</text>
  <line x1="380" y1="1131" x2="380" y2="1161" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- Box H -->
  <rect x="250" y="1163" width="260" height="55" rx="18" fill="white" stroke="black" stroke-width="1.4"/>
  <text x="380" y="1195" text-anchor="middle" font-size="13">Загрузка пар в Qdrant</text>
  <line x1="380" y1="1218" x2="380" y2="1246" stroke="black" stroke-width="1.3" marker-end="url(#arrowSolid)"/>

  <!-- final node -->
  <circle cx="380" cy="1266" r="16" fill="none" stroke="black" stroke-width="1.4"/>
  <circle cx="380" cy="1266" r="9" fill="black"/>
</svg>
