<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="black" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- document_ast -->
  <rect x="40" y="40" width="280" height="110" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="28" y="58" width="24" height="14" fill="white" stroke="black" stroke-width="1.3"/>
  <rect x="28" y="90" width="24" height="14" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="180" y="66" text-anchor="middle" font-size="15" font-weight="bold">document_ast</text>
  <text x="180" y="88" text-anchor="middle" font-size="12">разбор документа (LaTeX, текст)</text>
  <text x="180" y="105" text-anchor="middle" font-size="12">в дерево: раздел, подраздел,</text>
  <text x="180" y="122" text-anchor="middle" font-size="12">смысловой блок, определение</text>

  <!-- dsl -->
  <rect x="380" y="40" width="280" height="110" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="368" y="58" width="24" height="14" fill="white" stroke="black" stroke-width="1.3"/>
  <rect x="368" y="90" width="24" height="14" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="520" y="66" text-anchor="middle" font-size="15" font-weight="bold">dsl</text>
  <text x="520" y="88" text-anchor="middle" font-size="12">лексер, парсер и</text>
  <text x="520" y="105" text-anchor="middle" font-size="12">исполнитель запросов</text>
  <text x="520" y="122" text-anchor="middle" font-size="12">над деревом документа</text>

  <!-- actor_runtime -->
  <rect x="210" y="300" width="280" height="110" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="198" y="318" width="24" height="14" fill="white" stroke="black" stroke-width="1.3"/>
  <rect x="198" y="350" width="24" height="14" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="350" y="326" text-anchor="middle" font-size="15" font-weight="bold">actor_runtime</text>
  <text x="350" y="348" text-anchor="middle" font-size="12">конечные автоматы,</text>
  <text x="350" y="365" text-anchor="middle" font-size="12">обмен сообщениями,</text>
  <text x="350" y="382" text-anchor="middle" font-size="12">потоковый и асинхронный драйверы</text>

  <!-- dsl over document_ast -->
  <line x1="380" y1="95" x2="326" y2="95" stroke="black" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="350" y="86" text-anchor="middle" font-size="11" font-style="italic">&#171;use&#187;</text>

  <!-- document_ast to actor_runtime -->
  <line x1="185" y1="150" x2="270" y2="298" stroke="black" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="182" y="230" text-anchor="middle" font-size="11" font-style="italic">&#171;use&#187;</text>

  <!-- dsl to actor_runtime -->
  <line x1="515" y1="150" x2="430" y2="298" stroke="black" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="518" y="230" text-anchor="middle" font-size="11" font-style="italic">&#171;use&#187;</text>
</svg>
