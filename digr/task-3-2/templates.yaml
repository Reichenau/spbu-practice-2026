# Шаблоны фраз для определения типа связи между двумя понятиями (задача 3.2).
#
# Каждый шаблон — фрагмент regex (без учёта регистра), который ищется DSL-запросом
# CONTEXT вместе с упоминаниями обоих понятий в одном окне (см. relation_templates.py).
# Фразы подобраны не произвольно, а по реальным reference_chunk из
# chunks_ontology_text_reference.jsonl (учебник по дискретной математике) —
# см. data/samples_by_type.txt и отчёт, раздел "Откуда взяты шаблоны".
#
# Метки — те же 9, что использует relation_matcher (см. README оттуда):
# generalization/aggregation/composition/association/dependency/input/output/instance/manifest.

composition:
  - "состоит из"
  - "является подмножеством"
  - "фактормножеств"
  - "образован(?:а|о|ы)? из"
  - "включает в себя"
  - "модул(?:ь|ем) над"
  - "строится как"

aggregation:
  - "замкнут(?:о|а)? относительно"
  - "принадлежит"
  - "является элементом"
  - "входит в состав"
  - "подмножество .{0,40} называется"
  - "делится на"
  - "часть массива"
  - "часть отрезка"

dependency:
  # "(?<!не )" — исключаем отрицание "не зависит от" (это утверждение
  # независимости, а не зависимости; см. пример про толерантность в отчёте).
  - "(?<!не )зависит от"
  - "определяется через"
  - "определяется тем"
  - "выражается через"
  - "вычисляется через"
  - "следует из"

output:
  - "возвращает"
  - "результатом .{0,20} явля"
  - "на выходе"
  - "выдаёт"

input:
  - "принимает"
  - "на вход"
  - "аргументом .{0,20} явля"
  - "исходн(?:ый|ое|ая|ые)"

instance:
  - "является примером"
  - "например,? .{0,20}явля"
  - "частным примером"

association:
  - "связан(?:а|о|ы)? с"
  - "соответствует"
  - "относится к"
  - "имеет отношение к"

manifest:
  - "проявляется"
  - "реализуется"
  - "выражается в виде"

# generalization — самый частый класс (188/372 в эталоне) и одновременно самый
# "пустой" по формулировке: почти любое определение через "называется"/"является"
# без более специфичных маркеров выше по факту оказывается generalization.
# Поэтому это не просто ещё один шаблон, а откат по умолчанию в
# relation_templates.py, если ни один из специфичных выше не сработал.
generalization:
  - "частный случай"
  - "является видом"
  - "является обобщением"
  - "частным случаем"
